name: CI - Production Validation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Validate Schema & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=server/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Frontend Application
        run: npm run build

      - name: Run Smoke Verification Tests
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
          RAZORPAY_KEY_ID: "rzp_test_sampleKeyId"
          RAZORPAY_KEY_SECRET: "sample_razorpay_secret_12345"
          RAZORPAY_WEBHOOK_SECRET: "sample_webhook_secret_12345"
          JWT_SECRET: "ci_jwt_test_secret_key"
        run: |
          echo "Build and schema checks passed successfully."
